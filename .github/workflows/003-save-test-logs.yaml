name: "Exercise 3: Capture test logs as artifact"

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        # Checkout repo code so workflow has access to files
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Run tests
        run: uv run pytest --log-file="/tmp/test.log" --log-file-level=INFO
